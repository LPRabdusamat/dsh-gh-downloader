<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dsh-gh-downloader 面板预览</title>
<style>
 body{margin:0;background:#e6f3fb;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#173b52}
 .note{max-width:1400px;margin:0 auto;padding:10px 30px;font-size:12px;color:#5b7a8c}
 .app{height:80vh;max-width:1400px;margin:0 auto 24px;display:flex;flex-direction:column;border-top:3px solid #0099d8;background:linear-gradient(160deg,#dff4ff,#f4fbff 55%,#fff);border-radius:0 0 14px 14px;overflow:hidden}
 .fixed{flex:0 0 auto;padding:18px 30px 10px;border-bottom:3px solid #cbe8f7;background:linear-gradient(180deg,#e9f7ff,#f6fcff)}
 .scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 30px 40px}
 .inner{max-width:1400px;margin:0 auto}
 h1{font-size:20px;color:#008fd0;margin:0}.desc{font-size:12px;color:#5b7a8c;margin:4px 0 0}
 .bevel{border:2px solid #3a3a3a;box-shadow:inset 2px 2px 0 rgba(255,255,255,.45),inset -2px -2px 0 rgba(0,0,0,.35),0 3px 0 #1f1f1f;font-family:"Courier New",monospace;font-weight:700;cursor:pointer;border-radius:2px}
 .groove{background:#eef8ff;border:2px solid #7fd0f0;box-shadow:inset 2px 2px 0 rgba(0,80,120,.18),inset -2px -2px 0 rgba(255,255,255,.9);border-radius:3px}
 .btn{background:#7aa7c2;color:#fff;padding:8px 11px;font-size:12px}
 .primary{background:#5b8c3a;color:#fff;padding:9px 15px;font-size:12px}
 .chip{border:1px solid #ffd500;background:#fff1c1;color:#a87900;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:6px}
 input{font-family:inherit}
</style>
</head>
<body>
<div class="note">▼ 文件名/子目录行铺满整行；URL 框带 ❌ 清空；清空已完成、刷新已移到标签行右侧；按钮全部中文。</div>
<div class="app">
 <div class="fixed">
  <div class="inner">
   <h1>🔔 下载管理器</h1><p class="desc">GitHub 资源高速下载 · Agent 自动调用 · 支持手动粘贴</p>
   <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0">
    <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:280px">
     <div style="flex:1;min-width:140px;display:flex;align-items:center;gap:6px;padding:7px 12px;background:#fff;border:2px solid #0099d8;border-radius:22px;font-size:12px;color:#5b7a8c">📂 默认下载位置: <b style="color:#173b52;word-break:break-all">dsh-gh-downloader-downloads</b></div>
     <button class="bevel btn">📂 打开</button><button class="bevel btn">🔄 更换</button>
    </div>
   </div>
   <div style="background:#fff;border:3px solid #ffd500;border-radius:16px;padding:12px;display:grid;gap:9px;box-shadow:0 4px 0 #e5c400">
    <div style="display:flex;gap:6px;align-items:center">
     <input class="groove" style="flex:1;min-width:0;padding:10px 13px;color:#173b52" value="https://github.com/owner/repo/releases/download/v1/app.zip" readonly>
     <button class="bevel btn" style="flex:0 0 auto">❌</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;width:100%">
     <input class="groove" style="flex:1;min-width:0;padding:10px 13px" placeholder="文件名">
     <div style="position:relative;display:flex;gap:4px;align-items:center;flex:1;min-width:0">
      <input class="groove" style="flex:1;min-width:0;padding:10px 13px" placeholder="子目录（新建）">
      <button class="bevel btn" style="flex:0 0 auto;width:30px;height:32px;padding:0">▼</button>
      <div class="bevel" style="position:absolute;top:calc(100% + 6px);left:0;width:340px;background:#cfd8de;padding:0;z-index:5;box-shadow:inset 2px 2px 0 #fff,inset -2px -2px 0 #6b6b6b,0 8px 0 #1f1f1f">
       <div style="display:flex;gap:5px;padding:8px;border-bottom:2px solid #6b6b6b"><input class="groove" style="flex:1;min-width:0;padding:7px 9px;font-size:12px" placeholder="新子目录名"><button class="bevel btn">+ 新建</button></div>
       <div style="display:grid;gap:5px;max-height:150px;overflow:auto;padding:6px;background:#8b8b8b;border:2px solid #373737">
        <button class="bevel" style="background:#5b8c3a;color:#fff;text-align:left;padding:7px 10px;font-size:12px">📁 tools</button>
        <button class="bevel" style="background:#b9d9ec;color:#2b4a5d;text-align:left;padding:7px 10px;font-size:12px">📁 releases</button>
        <button class="bevel" style="background:#b9d9ec;color:#2b4a5d;text-align:left;padding:7px 10px;font-size:12px">📁 builds</button>
       </div>
       <div style="padding:5px 8px;font-size:11px;color:#2b4a5d;border-top:2px solid #9aa">下载根目录</div>
      </div>
     </div>
     <button class="bevel btn" style="flex:0 0 auto">🔗 转换链接</button>
     <button class="bevel primary" style="flex:0 0 auto">⬇ 开始下载</button>
    </div>
    <div style="font-size:11px;color:#5b7a8c">📍 子目录: dsh-gh-downloader-downloads</div>
   </div>
   <div style="display:flex;gap:6px;border-bottom:3px solid #d6eef9;margin-top:8px;padding-bottom:2px;flex-wrap:wrap;align-items:center">
    <button class="bevel primary" style="padding:8px 15px">全部  12</button>
    <button class="bevel" style="background:#b9d9ec;color:#4a6b7d;padding:8px 15px">下载中  3</button>
    <button class="bevel" style="background:#b9d9ec;color:#4a6b7d;padding:8px 15px">已完成  8</button>
    <button class="bevel" style="background:#b9d9ec;color:#4a6b7d;padding:8px 15px">失败  1</button>
    <span style="flex:1"></span>
    <button class="bevel btn">🧹 清空已完成</button>
    <button class="bevel btn">↻ 刷新</button>
   </div>
  </div>
 </div>
 <div class="scroll"><div class="inner" style="display:grid;gap:10px" id="rows"></div></div>
</div>
<script>
const EM={done:'✅',error:'❌',canceled:'🚫',paused:'⏸️',queued:'⏳',downloading:'📥'};
const st={downloading:'下载中',queued:'排队中',done:'已完成',error:'失败'};
const color=s=>s==='done'?'#28a745':s==='error'?'#e8382f':(s==='paused'||s==='canceled')?'#9fb3c0':'#0099d8';
const items=[];const names=['AdGuardHome_linux_amd64.tar.gz','source-main.zip','install.sh','node-v24-win-x64.zip','model.onnx','docs.pdf','firmware.bin','chest-texture.png','plugin-bundle.tgz','README.md','dataset.jsonl','tool.exe'];
const states=['downloading','downloading','downloading','queued','done','done','done','done','done','done','done','error'];
for(let i=0;i<12;i++)items.push({state:states[i],name:names[i],src:i%3===0?'agent':'manual',pct:states[i]==='done'?100:states[i]==='error'?20:[12,55,78][i%3],bytes:['7.4 MB','2.1 MB','7 KB','0 B','120 MB','1.2 MB','88 MB','340 KB','12 MB','4 KB','56 MB','4 MB'][i],total:states[i]==='done'?'yes':'',speed:states[i]==='downloading'?['2.1 MB/s','800 KB/s','1.4 MB/s'][i%3]:'',time:'16:4'+(i%10)+':12',ch:i%4===0?'gh-proxy':i%4===1?'ghfast':null});
document.getElementById('rows').innerHTML=items.map(x=>{const c=color(x.state);return `
<div style="display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:#fff;border:2px solid #bde6f8;border-radius:14px;box-shadow:0 3px 0 #d6eef9">
 <div style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:#e8f7ff;border:2px solid #0099d8">${EM[x.state]}</div>
 <div style="min-width:0">
  <div style="font-weight:700;word-break:break-all">${x.name}<span class="chip" style="${x.src==='manual'?'background:#e6eef3;color:#5b7a8c;border-color:#ccc':''}">${x.src==='agent'?'🤖 AI':'✋ 手动'}</span>${x.ch?`<span style="display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:#e8f7ff;color:#008fd0;margin-left:6px;font-family:monospace">⚡ ${x.ch}</span>`:''}</div>
  <div style="font-size:11px;color:#8aa3b2;margin-top:3px;word-break:break-all">https://github.com/owner/repo/releases/download/v1/${x.name}</div>
  <div class="groove" style="height:11px;margin-top:8px;padding:1px;box-sizing:border-box"><div style="height:100%;width:${x.pct}%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(0,0,0,.08)),${c}"></div></div>
  <div style="font-size:11px;margin-top:7px;display:flex;gap:12px;flex-wrap:wrap;color:#5b7a8c"><span style="color:${c};font-weight:700">${st[x.state]}</span><span>${x.bytes}${x.total?' ('+x.pct+'%)':''}</span>${x.speed?`<span>速度: ${x.speed}</span>`:''}<span>${x.time}</span></div>
 </div>
 <div style="display:flex;gap:5px"><button class="bevel btn" style="padding:6px 9px">${x.state==='done'?'📂':x.state==='error'?'↻':'⏸'}</button><button class="bevel btn" style="padding:6px 9px">🗑</button></div>
</div>`}).join('');
</script>
</body>
</html>
